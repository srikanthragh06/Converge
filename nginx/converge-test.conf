# TEMPORARY nginx config for testing the new droplet before the cutover, on
# new-api.converge.1k5.in and new.converge.1k5.in. Delete it (here and from
# sites-enabled) once the real subdomains point at the new droplet.
# Place at /etc/nginx/sites-available/converge-test.conf next to converge.conf,
# whose `converge` upstream it reuses.
# Activate with: ln -s /etc/nginx/sites-available/converge-test.conf /etc/nginx/sites-enabled/converge-test.conf
# TLS: issue the two certificates first (DNS for both names must already point
# here), e.g. `certbot certonly --standalone -d new-api.converge.1k5.in` and
# `certbot certonly --standalone -d new.converge.1k5.in` while nginx is stopped.


# --- Test API: new-api.converge.1k5.in (HTTPS) ---
# Same as the api.converge.1k5.in block in converge.conf.
server {
    server_name new-api.converge.1k5.in;

    proxy_buffer_size       256k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 512k;

    client_max_body_size 5m;

    location / {
        proxy_pass http://converge;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/new-api.converge.1k5.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new-api.converge.1k5.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}


# --- Test Web: new.converge.1k5.in (HTTPS) ---
# Same as the converge.1k5.in block in converge.conf, serving the same
# directory: until the cutover it holds the test build (which calls
# new-api.converge.1k5.in); the cutover replaces it with the real build.
server {
    server_name new.converge.1k5.in;

    root /var/www/converge;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/new.converge.1k5.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.converge.1k5.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}


# --- HTTP → HTTPS redirect (both test names) ---
server {
    listen 80;
    listen [::]:80;
    server_name new-api.converge.1k5.in new.converge.1k5.in;
    return 301 https://$host$request_uri;
}
